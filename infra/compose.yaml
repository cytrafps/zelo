# Environnement de développement : `docker compose -f infra/compose.yaml up --build`
# API sur http://localhost:8080, métriques sur http://localhost:8080/metrics, tableau de bord ville
# sur http://localhost:8090. La base et Valhalla n'écoutent que sur la machine elle-même (127.0.0.1) :
# Docker passe outre le pare-feu, un port publié sur toutes les interfaces serait ouvert à tout le réseau.
#
# Sauvegardes : service « backup », chaque nuit dans infra/backups (14 jours) ; copie hors de la
# machine avec --profile sauvegarde-distante (voir README).
#
# Accès depuis Internet en HTTPS (téléphone en 4G…), sans ouvrir de port, par Cloudflare Tunnel :
#   --profile tunnel-rapide   adresse https://….trycloudflare.com aléatoire, sans compte (tests)
#   --profile tunnel          adresse fixe sur ton domaine, avec TUNNEL_TOKEN (voir README)
services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: zelo
      POSTGRES_PASSWORD: zelo
      POSTGRES_DB: zelo
    ports: ["127.0.0.1:5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      # En TCP : pendant l'initialisation, le serveur temporaire n'écoute que sur le socket local.
      test: ["CMD-SHELL", "pg_isready -U zelo -d zelo -h 127.0.0.1"]
      interval: 3s
      retries: 20

  api:
    build: ../services/api
    environment:
      DATABASE_URL: postgres://zelo:zelo@db:5432/zelo?sslmode=disable
      # Bornes limitées à la zone de Reims pour le développement ; vide = toute la France.
      IMPORT_BBOX: "3.85,49.15,4.25,49.35"
      # true derrière Cloudflare : l'IP du client (quota de signalements) est lue dans CF-Connecting-IP,
      # seulement pour une connexion venue du réseau « proxys » (cloudflared, nginx du tableau de bord) :
      # le port 8080 publié sur le réseau local ne peut pas choisir son IP.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TRUSTED_PROXIES: 172.30.0.0/24
      # /metrics à part, jamais publié : le tunnel relaie tout le port 8080.
      METRICS_ADDR: ":9090"
      VALHALLA_URL: http://valhalla:8002
      # Vigilances Météo-France (facultatif) : METEOFRANCE_API_KEY=… dans infra/.env, jamais commité.
      METEOFRANCE_API_KEY: ${METEOFRANCE_API_KEY:-}
    ports: ["8080:8080"]
    networks: [default, proxys]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valhalla:
        condition: service_started # l'API démarre sans attendre : seuls les itinéraires patientent

  # Tableau de bord ville sur http://localhost:8090 (nginx relaie /v1 vers l'API).
  web:
    build: ../apps/web
    ports: ["8090:8080"]
    networks: [proxys]
    restart: unless-stopped
    depends_on: [api]

  # Itinéraires. Au premier démarrage, télécharge l'extrait OpenStreetMap de la Marne et construit
  # le graphe routier (~1 min, 600 Mo de mémoire au plus) ; ensuite il redémarre en moins d'une seconde.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted@sha256:d5382587f4ca9171caade2d1ab1212f26377dc5f121b9c6783deda8f4428472f
    environment:
      tile_urls: https://download.openstreetmap.fr/extracts/europe/france/champagne_ardenne/marne.osm.pbf
      build_elevation: "False"
      server_threads: "1"
    ports: ["127.0.0.1:8002:8002"]
    volumes: [valhalla:/custom_files]
    mem_limit: 1g
    restart: unless-stopped

  # Sauvegarde quotidienne de la base (pg_dump de la même version que le serveur).
  backup:
    image: postgis/postgis:17-3.5-alpine
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: zelo
      PGPASSWORD: zelo
      PGDATABASE: zelo
      BACKUP_HOUR: "3"
      KEEP_DAYS: "14"
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # Copie des sauvegardes hors de la machine (une panne du disque emporte la VM et ses
  # sauvegardes) : chaque nuit vers le « remote » rclone RCLONE_REMOTE (Google Drive chiffré…),
  # configuré dans infra/rclone/rclone.conf, jamais commité. Voir README.
  backup-distant:
    image: rclone/rclone:1.71
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          rclone copy /backups "$$RCLONE_REMOTE" --include 'zelo-*.dump' --max-age 3d && echo "copie distante faite"
          sleep 86400
        done
    environment:
      RCLONE_REMOTE: ${RCLONE_REMOTE:-zelo-sauvegardes:}
    volumes:
      - ./rclone:/config/rclone
      - ./backups:/backups:ro
    profiles: [sauvegarde-distante]
    restart: unless-stopped
    depends_on: [backup]

  tunnel-rapide:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate --url http://api:8080
    networks: [proxys]
    profiles: [tunnel-rapide]
    restart: unless-stopped
    depends_on: [api]

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-} # à définir dans infra/.env (voir README)
    networks: [proxys]
    profiles: [tunnel]
    restart: unless-stopped
    depends_on: [api]

# Proxys de confiance de l'API (TRUSTED_PROXIES) : seuls eux peuvent lui donner l'IP d'un client.
networks:
  proxys:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db:
  valhalla:
