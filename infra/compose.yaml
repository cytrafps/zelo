# Environnement de développement : `docker compose -f infra/compose.yaml up --build`
# API sur http://localhost:8080, métriques sur http://localhost:8080/metrics, Valhalla sur :8002,
# tableau de bord ville sur http://localhost:8090
#
# Accès depuis Internet en HTTPS (téléphone en 4G…), sans ouvrir de port, par Cloudflare Tunnel :
#   --profile tunnel-rapide   adresse https://….trycloudflare.com aléatoire, sans compte (tests)
#   --profile tunnel          adresse fixe sur ton domaine, avec TUNNEL_TOKEN (voir README)
services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: zelo
      POSTGRES_PASSWORD: zelo
      POSTGRES_DB: zelo
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      # En TCP : pendant l'initialisation, le serveur temporaire n'écoute que sur le socket local.
      test: ["CMD-SHELL", "pg_isready -U zelo -d zelo -h 127.0.0.1"]
      interval: 3s
      retries: 20

  api:
    build: ../services/api
    environment:
      DATABASE_URL: postgres://zelo:zelo@db:5432/zelo?sslmode=disable
      # Bornes limitées à la zone de Reims pour le développement ; vide = toute la France.
      IMPORT_BBOX: "3.85,49.15,4.25,49.35"
      # true derrière Cloudflare : l'IP du client (quota de signalements) est lue dans CF-Connecting-IP.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      VALHALLA_URL: http://valhalla:8002
      # Vigilances Météo-France (facultatif) : METEOFRANCE_API_KEY=… dans infra/.env, jamais commité.
      METEOFRANCE_API_KEY: ${METEOFRANCE_API_KEY:-}
    ports: ["8080:8080"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valhalla:
        condition: service_started # l'API démarre sans attendre : seuls les itinéraires patientent

  # Tableau de bord ville sur http://localhost:8090 (nginx relaie /v1 vers l'API).
  web:
    build: ../apps/web
    ports: ["8090:8080"]
    restart: unless-stopped
    depends_on: [api]

  # Itinéraires. Au premier démarrage, télécharge l'extrait OpenStreetMap de la Marne et construit
  # le graphe routier (~1 min, 600 Mo de mémoire au plus) ; ensuite il redémarre en moins d'une seconde.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted@sha256:d5382587f4ca9171caade2d1ab1212f26377dc5f121b9c6783deda8f4428472f
    environment:
      tile_urls: https://download.openstreetmap.fr/extracts/europe/france/champagne_ardenne/marne.osm.pbf
      build_elevation: "False"
      server_threads: "1"
    ports: ["8002:8002"]
    volumes: [valhalla:/custom_files]
    mem_limit: 1g
    restart: unless-stopped

  tunnel-rapide:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate --url http://api:8080
    profiles: [tunnel-rapide]
    restart: unless-stopped
    depends_on: [api]

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-} # à définir dans infra/.env (voir README)
    profiles: [tunnel]
    restart: unless-stopped
    depends_on: [api]

volumes:
  db:
  valhalla:
