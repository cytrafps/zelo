# En-têtes de sécurité, inclus par chaque bloc de nginx.conf. Polices servies par le site lui-même :
# plus de Google Fonts. Les styles passent par le CSSOM (React, MapLibre) : pas de 'unsafe-inline'.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://tiles.openfreemap.org https://data.geopf.fr; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
