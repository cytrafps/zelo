# Tableau de bord : fichiers statiques, et /v1 relayé vers l'API (même origine, sans CORS).
# Sur Kubernetes, l'Ingress envoie déjà /v1 à l'API : ce relais ne sert qu'en Docker Compose.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Le worker de MapLibre est un module .mjs : les navigateurs exigent un type JavaScript.
    location ~ \.mjs$ {
        types { text/javascript mjs; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fichiers nommés d'après leur contenu : gardés un an.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location = /livez {
        default_type text/plain;
        return 200 "ok";
    }

    # Toute page de l'app (/recharge, /signalements…) sert index.html, jamais mis en cache.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://tiles.openfreemap.org https://data.geopf.fr; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'";
    }
}
