# Tableau de bord : fichiers statiques, et /v1 relayé vers l'API (même origine, sans CORS).
# Sur Kubernetes, l'Ingress envoie déjà /v1 à l'API : ce relais ne sert qu'en Docker Compose.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # En-têtes de sécurité de toutes les réponses : un add_header dans un bloc location remplace ceux
    # du serveur, d'où ce fichier inclus partout.
    include /etc/nginx/snippets/securite.conf;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Le worker de MapLibre est un module .mjs : les navigateurs exigent un type JavaScript.
    location ~ \.mjs$ {
        types { text/javascript mjs; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/securite.conf;
    }

    # Fichiers nommés d'après leur contenu : gardés un an.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/securite.conf;
    }

    location /v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location = /livez {
        default_type text/plain;
        return 200 "ok";
    }

    # Toute page de l'app (/recharge, /signalements…) sert index.html, jamais mis en cache.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/securite.conf;
    }
}
