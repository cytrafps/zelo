name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    # Base réelle pour les tests d'intégration (diffusion NOTIFY entre instances, élection du collecteur).
    services:
      db:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: zelo
          POSTGRES_PASSWORD: zelo
          POSTGRES_DB: zelo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zelo -d zelo -h 127.0.0.1"
          --health-interval 3s --health-retries 20
    env:
      ZELO_TEST_DATABASE_URL: postgres://zelo:zelo@localhost:5432/zelo?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./cmd/api

  # Sur une PR : l'image est seulement construite. Sur main : publiée sur GHCR, puis son tag
  # est écrit dans deploy/overlays/homelab, qu'Argo CD applique au cluster (GitOps).
  api-image:
    runs-on: ubuntu-latest
    needs: api
    # Plusieurs fusions rapprochées : un seul déploiement à la fois, et une exécution en attente
    # est remplacée par la plus récente (qui contient déjà les précédentes).
    concurrency:
      group: api-image-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write # commit du nouveau tag
      packages: write # publication sur ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/zelo-api
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: services/api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.event_name == 'push'
        name: Déployer le nouveau tag (Argo CD)
        working-directory: deploy/overlays/homelab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Le tag est réécrit sur la dernière version de main à chaque essai : jamais de conflit
          # avec un autre commit de déploiement.
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            sed -i "/name: ghcr.io\/cytrafps\/zelo-api$/{n;s|newTag: .*|newTag: ${{ steps.tag.outputs.sha }}|}" kustomization.yaml
            git diff --quiet && exit 0
            git commit -qam "deploy: api ${{ steps.tag.outputs.sha }} [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  # Même chemin que l'API : image construite sur une PR, publiée sur main, tag écrit pour Argo CD.
  web-image:
    runs-on: ubuntu-latest
    needs: web
    concurrency:
      group: web-image-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/zelo-web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: apps/web
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - if: github.event_name == 'push'
        name: Déployer le nouveau tag (Argo CD)
        working-directory: deploy/overlays/homelab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            sed -i "/name: ghcr.io\/cytrafps\/zelo-web$/{n;s|newTag: .*|newTag: ${{ steps.tag.outputs.sha }}|}" kustomization.yaml
            git diff --quiet && exit 0
            git commit -qam "deploy: web ${{ steps.tag.outputs.sha }} [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  # Manifestes Kubernetes : rendu Kustomize, schémas (CRD comprises) et règles Prometheus.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Outils
        run: |
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz | tar xz
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          curl -sSfL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz | tar xz --strip-components=1 prometheus-3.5.0.linux-amd64/promtool
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Kustomize + kubeconform
        run: |
          kustomize build deploy/overlays/homelab > rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml deploy/argocd/*.yaml
      - name: Règles Prometheus
        run: |
          yq '{"groups": .spec.groups}' deploy/monitoring/alerts.yaml > rules.yml
          promtool check rules rules.yml
          promtool test rules deploy/monitoring/alerts_test.yml

  # Infrastructure du homelab : VM Proxmox (Terraform) et installation du cluster (Ansible).
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Outils
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://releases.hashicorp.com/terraform/1.13.4/terraform_1.13.4_linux_amd64.zip -o tf.zip
          unzip -q tf.zip terraform -d "$HOME/bin" && rm tf.zip
          echo "$HOME/bin" >> "$GITHUB_PATH"
          pipx install ansible-core==2.21.5 && pipx inject ansible-core ansible-lint==26.10.1 --include-apps
      - name: Terraform
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Ansible
        working-directory: infra/ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          cp inventory.ini.example inventory.ini
          ansible-playbook --syntax-check site.yml
          ansible-lint --profile production site.yml

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo-doctor
      - run: npx expo export --platform android --platform ios --output-dir dist

  # Conventions de CONTRIBUTING.md : le titre de la PR devient le commit sur main (squash).
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TITRE: ${{ github.event.pull_request.title }}
      BRANCHE: ${{ github.head_ref }}
    steps:
      - name: Titre de la PR
        run: |
          types='feat|fix|perf|refactor|test|docs|ci|deploy|chore'
          if ! [[ "$TITRE" =~ ^($types)(\([a-z0-9-]+\))?!?:\ .+ ]]; then
            echo "::error::Titre « $TITRE » : attendu « type(portée): description », ex. « fix(api): … » (voir CONTRIBUTING.md)"
            exit 1
          fi
      - name: Nom de la branche
        run: |
          types='feat|fix|perf|refactor|test|docs|ci|deploy|chore'
          if ! [[ "$BRANCHE" =~ ^($types)/[a-z0-9][a-z0-9-]*$ || "$BRANCHE" == dependabot/* ]]; then
            echo "::error::Branche « $BRANCHE » : attendu « type/sujet-en-kebab-case », ex. « feat/itineraire-parking » (voir CONTRIBUTING.md)"
            exit 1
          fi
