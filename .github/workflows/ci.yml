name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    # Base réelle pour les tests d'intégration (diffusion NOTIFY entre instances, élection du collecteur).
    services:
      db:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: zelo
          POSTGRES_PASSWORD: zelo
          POSTGRES_DB: zelo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zelo -d zelo -h 127.0.0.1"
          --health-interval 3s --health-retries 20
    env:
      ZELO_TEST_DATABASE_URL: postgres://zelo:zelo@localhost:5432/zelo?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./cmd/api

  # Sur une PR : l'image est seulement construite. Sur main : publiée sur GHCR, puis son tag
  # est écrit dans deploy/overlays/homelab, qu'Argo CD applique au cluster (GitOps).
  api-image:
    runs-on: ubuntu-latest
    needs: api
    # Plusieurs fusions rapprochées : un seul déploiement à la fois, et une exécution en attente
    # est remplacée par la plus récente (qui contient déjà les précédentes).
    concurrency:
      group: api-image-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write # commit du nouveau tag
      packages: write # publication sur ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/zelo-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet : le déploiement vérifie l'ordre des commits
          filter: blob:none
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.event_name == 'push'
        name: Déployer le nouveau tag (Argo CD)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/deploy-tag.sh "$IMAGE" ${{ steps.tag.outputs.sha }} api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  # Même chemin que l'API : image construite sur une PR, publiée sur main, tag écrit pour Argo CD.
  web-image:
    runs-on: ubuntu-latest
    needs: web
    concurrency:
      group: web-image-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/zelo-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet : le déploiement vérifie l'ordre des commits
          filter: blob:none
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/web
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - if: github.event_name == 'push'
        name: Déployer le nouveau tag (Argo CD)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/deploy-tag.sh "$IMAGE" ${{ steps.tag.outputs.sha }} web

  # Manifestes Kubernetes : rendu Kustomize, schémas (CRD comprises) et règles Prometheus.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Outils
        run: |
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          # Sommes de contrôle relevées sur les pages de publication : un binaire modifié est refusé.
          curl -sSfLO https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz
          curl -sSfLO https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          curl -sSfLO https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          sha256sum -c <<'SUMS'
          ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8  kustomize_v5.7.1_linux_amd64.tar.gz
          c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform-linux-amd64.tar.gz
          e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a  prometheus-3.5.0.linux-amd64.tar.gz
          SUMS
          tar xzf kustomize_v5.7.1_linux_amd64.tar.gz
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          tar xzf prometheus-3.5.0.linux-amd64.tar.gz --strip-components=1 prometheus-3.5.0.linux-amd64/promtool
          rm ./*.tar.gz
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Kustomize + kubeconform
        run: |
          kustomize build deploy/overlays/homelab > rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/3eb90d47aba8d61919d4419dd38301536e32a94b/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml deploy/argocd/*.yaml
      - name: Règles Prometheus
        run: |
          yq '{"groups": .spec.groups}' deploy/monitoring/alerts.yaml > rules.yml
          promtool check rules rules.yml
          promtool test rules deploy/monitoring/alerts_test.yml

  # Infrastructure du homelab : VM Proxmox (Terraform) et installation du cluster (Ansible).
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Outils
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://releases.hashicorp.com/terraform/1.13.4/terraform_1.13.4_linux_amd64.zip -o tf.zip
          echo "98aa516201e948306698efd9954ab4cc0d1227c2578ba56245898b5f679e590b  tf.zip" | sha256sum -c
          unzip -q tf.zip terraform -d "$HOME/bin" && rm tf.zip
          echo "$HOME/bin" >> "$GITHUB_PATH"
          pipx install ansible-core==2.21.5 && pipx inject ansible-core ansible-lint==26.10.1 --include-apps
      - name: Terraform
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Ansible
        working-directory: infra/ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          cp inventory.ini.example inventory.ini
          ansible-playbook --syntax-check site.yml
          ansible-lint --profile production site.yml

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo-doctor
      - run: npx expo export --platform android --platform ios --output-dir dist

  # Conventions de CONTRIBUTING.md : le titre de la PR devient le commit sur main (squash).
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TITRE: ${{ github.event.pull_request.title }}
      BRANCHE: ${{ github.head_ref }}
    steps:
      - name: Titre de la PR
        run: |
          types='feat|fix|perf|refactor|test|docs|ci|deploy|chore'
          if ! [[ "$TITRE" =~ ^($types)(\([a-z0-9-]+\))?!?:\ .+ ]]; then
            echo "::error::Titre « $TITRE » : attendu « type(portée): description », ex. « fix(api): … » (voir CONTRIBUTING.md)"
            exit 1
          fi
      - name: Nom de la branche
        run: |
          types='feat|fix|perf|refactor|test|docs|ci|deploy|chore'
          if ! [[ "$BRANCHE" =~ ^($types)/[a-z0-9][a-z0-9-]*$ || "$BRANCHE" == dependabot/* ]]; then
            echo "::error::Branche « $BRANCHE » : attendu « type/sujet-en-kebab-case », ex. « feat/itineraire-parking » (voir CONTRIBUTING.md)"
            exit 1
          fi
