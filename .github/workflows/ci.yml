name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./cmd/api

  # Sur une PR : l'image est seulement construite. Sur main : publiée sur GHCR, puis son tag
  # est écrit dans deploy/overlays/homelab, qu'Argo CD applique au cluster (GitOps).
  api-image:
    runs-on: ubuntu-latest
    needs: api
    permissions:
      contents: write # commit du nouveau tag
      packages: write # publication sur ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/zelo-api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: services/api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.event_name == 'push'
        name: Déployer le nouveau tag (Argo CD)
        working-directory: deploy/overlays/homelab
        run: |
          sed -i "s|^    newTag: .*|    newTag: ${{ steps.tag.outputs.sha }}|" kustomization.yaml
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: api ${{ steps.tag.outputs.sha }} [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1

  # Manifestes Kubernetes : rendu Kustomize, schémas (CRD comprises) et règles Prometheus.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz | tar xz
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          curl -sSfL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz | tar xz --strip-components=1 prometheus-3.5.0.linux-amd64/promtool
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Kustomize + kubeconform
        run: |
          kustomize build deploy/overlays/homelab > rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml deploy/argocd/*.yaml
      - name: Règles Prometheus
        run: |
          yq '{"groups": .spec.groups}' deploy/monitoring/alerts.yaml > rules.yml
          promtool check rules rules.yml
          promtool test rules deploy/monitoring/alerts_test.yml

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo-doctor
      - run: npx expo export --platform android --platform ios --output-dir dist
