name: Valhalla

# Graphe routier de la Marne reconstruit chaque semaine avec les données OpenStreetMap du jour,
# embarqué dans une image, puis déployé par Argo CD comme l'API (commit « deploy: »).
on:
  schedule:
    - cron: "17 3 * * 1" # lundi 3 h 17 UTC ; l'extrait openstreetmap.fr est régénéré chaque nuit
  workflow_dispatch:
  push:
    branches: [main]
    paths: [services/valhalla/**, .github/workflows/valhalla.yml]
  pull_request:
    paths: [services/valhalla/**, .github/workflows/valhalla.yml]

permissions:
  contents: read

concurrency:
  group: valhalla-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit du nouveau tag
      packages: write # publication sur ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/zelo-valhalla
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet : le déploiement vérifie l'ordre des commits
          filter: blob:none
          # build.sh (modifiable par une PR) tourne sans le jeton en écriture dans .git/config.
          persist-credentials: false
      - name: Construire le graphe routier
        working-directory: services/valhalla
        run: ./build.sh data
      - name: Vérifier un itinéraire (gare de Reims → cathédrale)
        working-directory: services/valhalla
        run: |
          docker build -t valhalla-test .
          docker run -d --name valhalla-check --read-only -p 8002:8002 valhalla-test
          for i in $(seq 1 30); do curl -fs localhost:8002/status >/dev/null && break; sleep 1; done
          curl -fsS localhost:8002/route -d '{"locations":[{"lat":49.2593,"lon":4.0249},{"lat":49.2536,"lon":4.0340}],"costing":"auto","directions_options":{"language":"fr-FR"}}' \
            | jq -e '.trip.summary.length > 1 and .trip.summary.length < 4 and (.trip.legs[0].maneuvers | length) > 3'
      - id: tag
        run: echo "tag=osm-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        name: Publier l'image
        run: |
          docker tag valhalla-test "$IMAGE:${{ steps.tag.outputs.tag }}"
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
      - if: github.event_name != 'pull_request'
        name: Déployer le nouveau tag (Argo CD)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/deploy-tag.sh "$IMAGE" ${{ steps.tag.outputs.tag }} valhalla
