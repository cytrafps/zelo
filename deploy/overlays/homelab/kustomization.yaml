# Environnement « homelab » : K3s + Traefik, déployé par Argo CD (deploy/argocd/zelo.yaml).
# La CI met à jour les tags des images (commits « deploy: ») : l'API à chaque fusion sur main,
# Valhalla chaque semaine avec les données OpenStreetMap du jour.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../monitoring
configMapGenerator:
  - name: api-config
    namespace: zelo
    literals:
      - IMPORT_BBOX=3.85,49.15,4.25,49.35 # Grand Reims
patches:
  - target: { kind: Ingress, name: api }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.zelo.lan
images:
  - name: ghcr.io/cytrafps/zelo-api
    newTag: sha-872ebba
  - name: ghcr.io/cytrafps/zelo-valhalla
    newTag: osm-20261027-7106417
