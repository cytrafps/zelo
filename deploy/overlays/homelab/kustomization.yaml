# Environnement « homelab » : K3s + Traefik, déployé par Argo CD (deploy/argocd/zelo.yaml).
# La CI met à jour les tags des images (commits « deploy: ») : l'API et le tableau de bord à
# chaque fusion sur main,
# Valhalla chaque semaine avec les données OpenStreetMap du jour.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../monitoring
  - compress.yaml
configMapGenerator:
  - name: api-config
    namespace: zelo
    literals:
      - IMPORT_BBOX=3.38,48.51,5.04,49.41 # la Marne, comme le graphe routier
      # Réseau des pods K3s : Traefik y est, l'IP cliente est lue dans X-Forwarded-For.
      - TRUSTED_PROXIES=10.42.0.0/16
patches:
  - target: { kind: Ingress, name: api }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.zelo.lan
      - op: add
        path: /metadata/annotations
        value:
          traefik.ingress.kubernetes.io/router.middlewares: zelo-compress@kubernetescrd
  - target: { kind: Ingress, name: web }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ville.zelo.lan
      - op: add
        path: /metadata/annotations
        value:
          traefik.ingress.kubernetes.io/router.middlewares: zelo-compress@kubernetescrd
images:
  - name: ghcr.io/cytrafps/zelo-api
    newTag: sha-9d473f4
  - name: ghcr.io/cytrafps/zelo-web
    newTag: sha-f2db778
  - name: ghcr.io/cytrafps/zelo-valhalla
    newTag: osm-20261028-0be4282
