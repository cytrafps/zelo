# Prometheus, Alertmanager et Grafana (kube-prometheus-stack), installés par Argo CD.
# Vague -1 : les CRD (ServiceMonitor, PrometheusRule) doivent exister avant l'application Zelo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 77.*
    helm:
      releaseName: monitoring
      valuesObject:
        grafana:
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              searchNamespace: ALL
        prometheus:
          prometheusSpec:
            retention: 15d
            resources:
              requests: { cpu: 100m, memory: 512Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRD trop volumineuses pour kubectl apply classique
