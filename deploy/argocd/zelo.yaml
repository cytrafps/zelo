# Déploiement continu (GitOps) : Argo CD applique deploy/overlays/homelab à chaque commit sur main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zelo
  namespace: argocd
spec:
  project: zelo # voir project.yaml : limité à l'espace de noms zelo
  source:
    repoURL: https://github.com/cytrafps/zelo.git
    targetRevision: main
    path: deploy/overlays/homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: zelo
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
