apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zelo-api
  labels:
    release: monitoring
spec:
  groups:
    - name: zelo-api
      rules:
        - alert: ZeloApiDown
          expr: up{namespace="zelo", service="api"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: L'API Zelo ne répond plus à Prometheus.
        # Seuil = 3 cycles manqués : une panne passagère de la source n'alerte pas.
        - alert: ZeloDonneesPerimees
          expr: |
            time() - zelo_ingest_last_success_timestamp_seconds
              > on (source) group_left ()
            (
                label_replace(vector(1800),   "source", "carburant",          "", "")
              or label_replace(vector(900),    "source", "bornes_dynamique",   "", "")
              or label_replace(vector(259200), "source", "bornes_statique",    "", "")
              or label_replace(vector(259200), "source", "parkings",           "", "")
              or label_replace(vector(10800),  "source", "purge_signalements", "", "")
            )
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Données « {{ $labels.source }} » non rafraîchies depuis {{ $value | humanizeDuration }}."
        - alert: ZeloCollecteEnEchec
          expr: increase(zelo_ingest_runs_total{result="erreur"}[1h]) >= 3
          labels: { severity: warning }
          annotations:
            summary: "La collecte « {{ $labels.source }} » a échoué {{ $value }} fois en une heure."
