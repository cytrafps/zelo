apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zelo-api
  labels:
    release: monitoring
spec:
  groups:
    - name: zelo-api
      rules:
        - alert: ZeloApiDown
          expr: sum(up{namespace="zelo", service="api"}) == 0 or absent(up{namespace="zelo", service="api"})
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: Plus aucune réplique de l'API Zelo ne répond.
        - alert: ZeloRepliqueDown
          expr: up{namespace="zelo", service="api"} == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "La réplique {{ $labels.pod }} ne répond plus ; le service continue sur l'autre."
        # Le meneur se perd 15 s au plus lors d'une bascule ; au-delà de 5 min, plus rien n'est collecté.
        - alert: ZeloAucunCollecteur
          expr: sum(zelo_collector_leader{namespace="zelo"}) == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: Aucune réplique ne détient le verrou des collectes.
        - alert: ZeloPlusieursCollecteurs
          expr: sum(zelo_collector_leader{namespace="zelo"}) > 1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "{{ $value }} répliques collectent en même temps : le verrou PostgreSQL ne joue plus son rôle."
        # Seuil = 3 cycles manqués : une panne passagère de la source n'alerte pas.
        - alert: ZeloDonneesPerimees
          expr: |
            time() - zelo_ingest_last_success_timestamp_seconds
              > on (source) group_left ()
            (
                label_replace(vector(1800),   "source", "carburant",          "", "")
              or label_replace(vector(900),    "source", "bornes_dynamique",   "", "")
              or label_replace(vector(259200), "source", "bornes_statique",    "", "")
              or label_replace(vector(259200), "source", "parkings",           "", "")
              or label_replace(vector(259200), "source", "feux_stops",         "", "")
              or label_replace(vector(259200), "source", "aires",              "", "")
              or label_replace(vector(259200), "source", "transports",         "", "")
              or label_replace(vector(259200), "source", "tarifs",             "", "")
              or label_replace(vector(259200), "source", "fermetures",         "", "")
              or label_replace(vector(259200), "source", "zfe",                "", "")
              or label_replace(vector(3600),   "source", "vigilance",          "", "")
              or label_replace(vector(600),    "source", "temps_reel",         "", "")
              or label_replace(vector(10800),  "source", "purge_signalements", "", "")
            )
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Données « {{ $labels.source }} » non rafraîchies depuis {{ $value | humanizeDuration }}."
        # Sauvegarde quotidienne (CronJob sauvegarde-db, 3 h) : métriques de kube-state-metrics.
        # 26 h : un passage manqué, avec une marge pour une sauvegarde lente.
        - alert: ZeloSauvegardeAncienne
          expr: time() - kube_cronjob_status_last_successful_time{namespace="zelo", cronjob="sauvegarde-db"} > 26 * 3600
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: "Dernière sauvegarde réussie de la base il y a {{ $value | humanizeDuration }}."
        - alert: ZeloSauvegardeEnEchec
          expr: kube_job_status_failed{namespace="zelo", job_name=~"sauvegarde-db-.*"} > 0
          labels: { severity: warning }
          annotations:
            summary: "La sauvegarde {{ $labels.job_name }} a échoué (dump ou copie distante) : voir ses journaux."
        - alert: ZeloCollecteEnEchec
          # Le temps réel, lu toutes les 30 s, a son propre seuil de fraîcheur (10 min) au lieu de celui-ci.
          expr: increase(zelo_ingest_runs_total{result="erreur", source!="temps_reel"}[1h]) >= 3
          labels: { severity: warning }
          annotations:
            summary: "La collecte « {{ $labels.source }} » a échoué {{ $value }} fois en une heure."
        # Valhalla injoignable ou en panne : les calculs d'itinéraire répondent 502.
        - alert: ZeloItinerairesEnErreur
          expr: |
            sum(rate(zelo_routes_total{result="erreur"}[10m])) / sum(rate(zelo_routes_total[10m])) > 0.2
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "{{ $value | humanizePercentage }} des calculs d'itinéraire échouent : vérifier Valhalla."
        - alert: ZeloErreursServeur
          expr: |
            sum(rate(zelo_http_requests_total{code=~"5.."}[10m])) / sum(rate(zelo_http_requests_total[10m])) > 0.05
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $value | humanizePercentage }} des requêtes de l'API répondent une erreur serveur."
