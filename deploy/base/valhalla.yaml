# Calcul d'itinéraires (Valhalla) avec le graphe routier embarqué dans l'image
# (construit chaque semaine par la CI : .github/workflows/valhalla.yml). Sans état : se relance en 0,4 s.
# Deux répliques à deux fils : un calcul long (trajet national) ne bloque plus les autres, et une
# mise à jour du graphe ou un nœud en maintenance ne coupe pas les itinéraires.
apiVersion: v1
kind: Service
metadata:
  name: valhalla
spec:
  selector:
    app.kubernetes.io/name: valhalla
  ports:
    - name: http
      port: 8002
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valhalla
  labels:
    app.kubernetes.io/name: valhalla
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: valhalla
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valhalla
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: valhalla
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valhalla
          image: ghcr.io/cytrafps/zelo-valhalla
          # Nombre de fils de calcul (dernier argument), aussi fixé dans l'image depuis cette version.
          command: [valhalla_service, /custom_files/valhalla.json, "2"]
          ports:
            - name: http
              containerPort: 8002
          readinessProbe:
            httpGet: { path: /status, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /status, port: http }
            periodSeconds: 20
          resources:
            # Mesuré à un fil : 40 Mo au repos, ~200 Mo après une série de calculs (essai du 27/10/2026) ;
            # chaque fil a son propre cache de tuiles.
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: valhalla
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valhalla
