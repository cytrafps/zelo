# Seules /v1 (API et WebSocket) et /healthz sont publiques ; /metrics reste interne au cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
spec:
  rules:
    - host: zelo.example.test # remplacé par l'overlay
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service: { name: api, port: { name: http } }
          - path: /healthz
            pathType: Exact
            backend:
              service: { name: api, port: { name: http } }
