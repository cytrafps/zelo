# API Zelo, deux répliques sans état partagé en mémoire :
# - les signalements sont diffusés par PostgreSQL (LISTEN/NOTIFY) à toutes les répliques ;
# - une seule réplique fait les collectes, élue par verrou consultatif PostgreSQL ; si elle tombe,
#   le verrou se libère et une autre prend le relais (15 s au plus).
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # mise à jour sans coupure
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      automountServiceAccountToken: false
      # Répliques sur des nœuds différents quand le cluster en a plusieurs.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/cytrafps/zelo-api
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zelo-db
                  key: password
            - name: DATABASE_URL
              value: postgres://zelo:$(DB_PASSWORD)@db:5432/zelo?sslmode=disable
            # Clé de l'API Vigilance de Météo-France (portail-api.meteofrance.fr) ; sans elle, pas de vigilance.
            - name: METEOFRANCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zelo-meteofrance
                  key: api-key
                  optional: true
            - name: TRUST_PROXY
              value: "false"
            - name: VALHALLA_URL
              value: http://valhalla:8002
            # Le ramasse-miettes de Go travaille plus tôt à l'approche de la limite plutôt que de la dépasser (OOM).
            - name: GOMEMLIMIT
              value: 460MiB
          envFrom:
            - configMapRef:
                name: api-config
                optional: true
          ports:
            - name: http
              containerPort: 8080
          # Pod retiré des points d'accès avant l'arrêt : 5 s pour que Traefik cesse de lui envoyer
          # des requêtes, puis SIGTERM (requêtes en cours terminées, flux temps réel fermés proprement).
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          # /livez ne dépend pas de la base : une panne PostgreSQL ne doit pas faire redémarrer l'API en boucle.
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 15
          # /healthz attend jusqu'à 2 s la base : au-delà du délai d'1 s par défaut, une base lente
          # retirait tous les pods ensemble.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 512Mi } # l'import IRVE dynamique lit ~90 000 lignes
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
# Une maintenance de nœud (drain) ne peut pas arrêter les deux répliques en même temps.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
